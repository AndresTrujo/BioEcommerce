{% extends 'base.html' %} {# O tu plantilla base #}
{% load static %}
{% block title %}
  Pago Cancelado
{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center min-h-[60vh] px-4">
  <div class="bg-white rounded-2xl shadow-lg p-8 max-w-lg w-full flex flex-col items-center mb-4">
  &nbsp;
  <img src="{% static 'img/cross.png' %}" alt="Pago Abortado" class="w-24 h-24 mb-4">

  <h1 class="text-3xl font-bold text-red-700 mb-2 text-center">Pago Cancelado</h1>
  <p class="text-gray-700 text-center mb-2">Tu transacción ha sido cancelada.</p>
  <p>
    Puedes <a href="{% url 'cart:cart_detail' %}">volver a tu carrito</a> o <a href="{% url 'products:product_list' %}">seguir comprando</a>.
  </p>
{% endblock %}

{% block banner %}
  <section class="h-[72px]"></section>
{% endblock %}
